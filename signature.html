<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZAD — Speciality Coffee Menu</title>
  <meta name="description" content="ZAD Speciality Coffee — Full Menu" />
  <link rel="icon" href="logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="z-app">

  <!-- HERO -->
  <header class="z-hero">
    <div class="z-hero-img"></div>
    <div class="z-hero-overlay"></div>
    <div class="z-hero-content">
      <img src="logo.png" alt="ZAD" class="z-hero-logo" />
    </div>
    <a href="#Coffee" class="z-hero-down">
      <span>Explore Menu</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 3v10M3 9l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </header>

  <!-- NAV -->
  <nav class="z-nav">
    <div class="z-nav-inner"></div>
  </nav>

  <!-- SECTION (built by JS) -->
  <main class="z-main"></main>

  <!-- FOOTER -->
  <footer class="z-footer">
    <img src="logo.png" alt="ZAD" class="z-footer-logo" />

    <div class="z-social">
      <!-- Instagram -->
      <a href="#" class="z-social-btn" target="_blank" rel="noopener" aria-label="Instagram">

          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>

      </a>
      <!-- TikTok -->
